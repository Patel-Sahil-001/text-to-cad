services:
  - type: web
    name: text-to-cad-studio
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PORT
        value: 8000
      - key: CADGEN_MEMORY_MB
        value: "0"
